[tool.uv.workspace]
members = [
  "apps/api",
  "apps/ai",
  "apps/mcp",
  "apps/worker_domain",
  "apps/worker_connector",
  "packages/core",
  "packages/audit",
  "packages/db",
  "packages/secrets",
  "packages/tools",
  "packages/topology",
  "packages/providers/base",
  "packages/providers/aws",
  "packages/providers/azure",
  "packages/providers/gcp",
  "packages/providers/ibm",
  "packages/catalog",
  "packages/sizing",
  "packages/cost",
  "packages/assessment",
  "packages/planner",
  "packages/iac",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.9.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "testcontainers>=4.8.0",
  "hypothesis>=6.119.0",
  "aiosqlite>=0.22.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
