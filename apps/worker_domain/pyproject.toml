[project]
name = "aether-worker-domain"
version = "0.1.0"
description = "AETHER MIGRATE — Temporal domain worker (sizing, cost, assessment, planner)"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.9.0",
  "structlog>=24.4.0",
  "aether-core",
  "aether-sizing",
  "aether-cost",
  "aether-assessment",
  "aether-planner",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-sizing = { workspace = true }
aether-cost = { workspace = true }
aether-assessment = { workspace = true }
aether-planner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_domain"]
