[project]
name = "aether-ai"
version = "0.1.0"
description = "AETHER MIGRATE — AI model gateway and orchestrator (Phase 3)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "structlog>=24.4.0",
  "pydantic-ai>=0.1.0",
  "httpx>=0.28.0",
  "aether-core",
  "aether-tools",
  "aether-db",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-tools = { workspace = true }
aether-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]
