[project]
name = "aether-mcp"
version = "0.1.0"
description = "AETHER MIGRATE — MCP server (Phase 7)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "structlog>=24.4.0",
  "python-jose[cryptography]>=3.3.0",
  "aether-core",
  "aether-tools",
  "aether-db",
  "aether-audit",
  "aether-planner",
  "aether-iac",
  "aether-sizing",
  "aether-assessment",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-tools = { workspace = true }
aether-db = { workspace = true }
aether-audit = { workspace = true }
aether-planner = { workspace = true }
aether-iac = { workspace = true }
aether-sizing = { workspace = true }
aether-assessment = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
