[project]
name = "aether-api"
version = "0.1.0"
description = "AETHER MIGRATE — REST API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-jose[cryptography]>=3.3.0",
  "structlog>=24.4.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "aether-core",
  "aether-audit",
  "aether-db",
  "aether-secrets",
  "aether-providers-aws",
  "aether-topology",
  "aether-planner",
  "aether-iac",
  "aether-sizing",
  "aether-assessment",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-audit = { workspace = true }
aether-db = { workspace = true }
aether-secrets = { workspace = true }
aether-providers-aws = { workspace = true }
aether-topology = { workspace = true }
aether-planner = { workspace = true }
aether-iac = { workspace = true }
aether-sizing = { workspace = true }
aether-assessment = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
