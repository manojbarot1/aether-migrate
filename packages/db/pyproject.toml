[project]
name = "aether-db"
version = "0.1.0"
description = "AETHER MIGRATE — async SQLAlchemy engine, ORM models, Alembic migrations"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "aether-core",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db"]
