# Alembic configuration file for AETHER MIGRATE DB package.
# The actual DATABASE_URL is read from the environment variable; do not
# hardcode credentials here.

[alembic]
# %(here)s = the directory containing this alembic.ini file
# Migrations live in the same directory as this file (versions/ subdir)
script_location = %(here)s
prepend_sys_path = .

# Use DATABASE_URL from environment; see env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
