[project]
name = "aether-secrets"
version = "0.1.0"
description = "AETHER MIGRATE — OpenBao credential service (KV v2 + Transit)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "structlog>=24.4.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secrets_svc"]
