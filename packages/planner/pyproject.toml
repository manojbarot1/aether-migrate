[project]
name = "aether-planner"
version = "0.1.0"
description = "AETHER MIGRATE — migration plan builder (Phase 4 implementation)"
requires-python = ">=3.12"
dependencies = [
  "aether-core",
  "aether-assessment",
  "aether-cost",
  "aether-sizing",
  "aether-db",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-assessment = { workspace = true }
aether-cost = { workspace = true }
aether-sizing = { workspace = true }
aether-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]
