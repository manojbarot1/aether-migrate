[project]
name = "aether-cost"
version = "0.1.0"
description = "AETHER MIGRATE — cost modeling and comparison (Phase 5 implementation)"
requires-python = ">=3.12"
dependencies = [
  "aether-core",
  "aether-catalog",
  "aether-db",
  "aether-sizing",
  "structlog>=24.4.0",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-catalog = { workspace = true }
aether-db = { workspace = true }
aether-sizing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost"]
