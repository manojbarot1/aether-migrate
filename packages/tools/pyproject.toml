[project]
name = "aether-tools"
version = "0.1.0"
description = "AETHER MIGRATE — typed tool registry (Phase 3 will populate tools)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "aether-core",
  "aether-topology",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-topology = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools"]
