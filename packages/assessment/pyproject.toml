[project]
name = "aether-assessment"
version = "0.1.0"
description = "AETHER MIGRATE — migration readiness assessment engine"
requires-python = ">=3.12"
dependencies = [
  "aether-core",
  "aether-db",
  "structlog>=24.1.0",
  "sqlalchemy>=2.0.0",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assessment"]
