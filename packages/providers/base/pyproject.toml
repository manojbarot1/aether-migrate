[project]
name = "aether-providers-base"
version = "0.1.0"
description = "AETHER MIGRATE — provider adapter protocol and supporting types"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "aether-core",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/providers_base"]
