[project]
name = "aether-core"
version = "0.1.0"
description = "AETHER MIGRATE — normalized domain models, types, provenance, errors"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
