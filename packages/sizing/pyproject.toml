[project]
name = "aether-sizing"
version = "0.1.0"
description = "AETHER MIGRATE — right-sizing engine (Phase 3 implementation)"
requires-python = ">=3.12"
dependencies = [
  "aether-core",
  "aether-catalog",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-catalog = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sizing"]
