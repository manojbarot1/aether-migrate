[project]
name = "aether-iac"
version = "0.1.0"
description = "AETHER MIGRATE — OpenTofu/Terraform IaC generation (Phase 6 implementation)"
requires-python = ">=3.12"
dependencies = [
  "aether-core",
  "aether-planner",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-core = { workspace = true }
aether-planner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iac"]
