[project]
name = "aether-topology"
version = "0.1.0"
description = "AETHER MIGRATE — topology graph building and Mermaid generation"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "sqlalchemy>=2.0.0",
  "aether-db",
]

[tool.uv]
package = true

[tool.uv.sources]
aether-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topology"]
