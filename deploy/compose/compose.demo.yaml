# Demo overlay: an AWS simulator (moto) seeded with a multi-region estate, so the whole
# product can be evaluated without a cloud account. NEVER combine with real connections:
# the connector's AWS endpoint is redirected to the simulator.
#
#   AETHER_COMPOSE_OVERLAY=deploy/compose/compose.dev.yaml  (plus this file via -f)
services:
  aws-sim:
    image: motoserver/moto:5.2.3
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MOTO_PORT: "5000"
    networks: [data]
    mem_limit: 512m

  aws-sim-seed:
    image: ${AETHER_REGISTRY:-aether}/connector:${AETHER_VERSION:-0.1.0}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "/demo/seed_aws_sim.py"]
    environment:
      AWS_ENDPOINT_URL: http://aws-sim:5000
      AWS_ACCESS_KEY_ID: AKIADEMODEMODEMODEMO
      AWS_SECRET_ACCESS_KEY: demo-not-a-secret
    volumes: ["../demo/seed_aws_sim.py:/demo/seed_aws_sim.py:ro"]
    networks: [data]
    depends_on: [aws-sim]

  worker-connector:
    environment:
      AWS_ENDPOINT_URL: http://aws-sim:5000
