# AETHER MIGRATE — Local LLM override (Ollama)
# Usage: docker compose -f compose.yaml -f compose.local-llm.yaml up
#
# NOTE: Ollama has no Red Hat registry equivalent — official image used.
# Requires GPU passthrough or CPU-only mode (set OLLAMA_NUM_GPU=0).

services:

  ollama:
    image: ollama/ollama:0.5.7
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app
    # Uncomment for NVIDIA GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    environment:
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-0}   # 0 = CPU only

  ai:
    environment:
      - LLM_PROVIDER=ollama
      - LLM_BASE_URL=http://ollama:11434
      - LLM_MODEL=${OLLAMA_MODEL:-llama3.2}
    depends_on:
      - ollama

volumes:
  ollama_data: {}
