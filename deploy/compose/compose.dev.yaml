# Local development overlay: plain HTTP on localhost, Temporal UI on loopback, API docs on.
# Enable with AETHER_COMPOSE_OVERLAY=deploy/compose/compose.dev.yaml in .env and
# AETHER_PUBLIC_URL=http://localhost:<EDGE_HTTP_PORT>.
services:
  edge:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.http", "--adapter", "caddyfile"]

  api:
    environment:
      AETHER_ENV: dev

  temporal-ui:
    image: temporalio/ui:2.54.1
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: aether
    ports: ["127.0.0.1:8233:8080"]
    mem_limit: 256m
    networks: [data, edge]
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
