name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, types, tests on Postgres)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        run: docker compose -f deploy/compose/compose.test.yaml build tests
      - name: Lint and type-check
        run: >
          docker compose -f deploy/compose/compose.test.yaml run --rm --no-deps
          -e RUFF_CACHE_DIR=/tmp/rc -e MYPY_CACHE_DIR=/tmp/mc tests
          sh -c "ruff check src tests && ruff format --check src tests && lint-imports && mypy src"
      - name: Tests (unit + integration against PostgreSQL 18)
        run: docker compose -f deploy/compose/compose.test.yaml run --rm tests
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/compose.test.yaml down -v

  frontend:
    name: frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  deploy-config:
    name: deploy config (compose hardening, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder secrets and env for config resolution
        run: |
          cp .env.example .env
          for f in pg_superuser_password pg_owner_password pg_app_password pg_temporal_password \
                   pg_keycloak_password keycloak_admin_password bao_api_role_id bao_api_secret_id \
                   bao_connector_role_id bao_connector_secret_id; do echo x > deploy/secrets/$f; done
      - name: Compose hardening baseline
        run: >
          docker compose --project-directory deploy/compose -f deploy/compose/compose.yaml --env-file .env
          config --format json | python3 deploy/scripts/lint_compose.py
      - name: Dev overlay resolves
        run: >
          docker compose --project-directory deploy/compose -f deploy/compose/compose.yaml
          -f deploy/compose/compose.dev.yaml --env-file .env config --quiet
      - name: shellcheck
        run: >
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable -x
          deploy/scripts/*.sh deploy/scripts/aetherctl deploy/config/postgres/10-init-roles.sh

  secrets-scan:
    name: secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: images (build + vulnerability scan)
    runs-on: ubuntu-24.04
    needs: [backend, frontend, deploy-config]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: docker/backend.Dockerfile, target: api }
          - { name: connector, dockerfile: docker/backend.Dockerfile, target: connector }
          - { name: web, dockerfile: docker/web.Dockerfile, target: web }
          - { name: edge, dockerfile: docker/edge.Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          tags: aether/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: aether/${{ matrix.name }}:ci
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
