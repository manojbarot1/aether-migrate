name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write   # for cosign keyless signing

jobs:

  release:
    name: Build, Push & Sign
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: push-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aether-api:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/aether-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI image
        id: push-ai
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ai.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aether-ai:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/aether-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        id: push-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aether-worker:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/aether-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        id: push-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aether-web:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/aether-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images with cosign (keyless)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/aether-api@${{ steps.push-api.outputs.digest }}
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/aether-ai@${{ steps.push-ai.outputs.digest }}
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/aether-worker@${{ steps.push-worker.outputs.digest }}
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/aether-web@${{ steps.push-web.outputs.digest }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "AETHER MIGRATE ${{ github.ref_name }}"
