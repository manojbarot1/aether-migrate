[project]
name = "aether-migrate"
version = "0.1.0"
description = "Cloud-neutral migration control plane"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "temporalio>=1.9",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
# Cloud SDKs are only installed in the connector image (credential boundary).
connector = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "moto[sts,iam,ec2]>=5.0",
    "boto3>=1.35",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "boto3-stubs[sts,iam,ec2]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
# S105/S106 (password-looking names) are noisy here; gitleaks in CI scans for real secrets.
ignore = ["S101", "S105", "S106", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/aether/db/migrations/**" = ["E501"]
# Rule messages and remediations are user-facing prose; wrapping them hurts readability.
"src/aether/assessment/engine.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["src/aether/db/migrations/"]

[[tool.mypy.overrides]]
module = ["moto.*", "botocore.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs Postgres (run inside the compose test stack)",
]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs ORM code in greenlets.
concurrency = ["greenlet", "thread"]
source = ["aether"]
omit = ["src/aether/db/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# Layering rules. The credential boundary is enforced at deploy time by separate
# containers and OpenBao policies; these contracts keep the code honest too.
[tool.importlinter]
root_package = "aether"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "API and AI layers never import cloud provider adapters"
type = "forbidden"
source_modules = ["aether.api", "aether.tools"]
forbidden_modules = ["aether.providers.aws", "boto3", "botocore"]

[[tool.importlinter.contracts]]
name = "Core domain model has no infrastructure dependencies"
type = "forbidden"
source_modules = ["aether.core"]
forbidden_modules = ["aether.db", "aether.api", "aether.secrets", "aether.providers", "sqlalchemy", "fastapi"]
